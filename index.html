<!DOCTYPE html>
<html>
<head>
    <title>Binary Search Visualizer</title>

    <style>

        body{
            background:#111;
            color:white;
            text-align:center;
            font-family:Arial;
            padding:20px;
        }

        h1{
            margin-bottom:20px;
        }

        input{
            padding:10px;
            width:350px;
            border:none;
            border-radius:5px;
            font-size:16px;
        }

        button{
            padding:10px 20px;
            margin:10px;
            border:none;
            border-radius:5px;
            background:orange;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        #array-container{
            display:flex;
            justify-content:center;
            align-items:flex-end;
            height:400px;
            margin-top:40px;
        }

        .bar{
            width:45px;
            margin:4px;
            background:cyan;
            color:black;
            font-weight:bold;
            display:flex;
            justify-content:center;
            align-items:flex-end;
        }

        #result{
            margin-top:20px;
            font-size:22px;
        }

    </style>
</head>

<body>

<h1>Binary Search Sorting Visualizer</h1>

<p>Enter numbers separated by commas</p>

<input type="text" id="numbers" placeholder="Example: 34,12,5,67,23">

<br>

<button onclick="sortArray()">Sort Numbers</button>

<button onclick="binarySearch()">Binary Search</button>

<div id="array-container"></div>

<div id="result"></div>

<script>

let sortedArray = [];

function sortArray(){

    const input = document.getElementById("numbers").value;

    let arr = input.split(",").map(Number);

    sortedArray = arr.sort((a,b)=>a-b);

    displayBars(sortedArray);

    document.getElementById("result").innerHTML =
    "Sorted Array: " + sortedArray.join(", ");
}

function displayBars(arr){

    const container = document.getElementById("array-container");

    container.innerHTML = "";

    arr.forEach(num => {

        const bar = document.createElement("div");

        bar.classList.add("bar");

        bar.style.height = (num * 3) + "px";

        bar.innerHTML = num;

        container.appendChild(bar);

    });
}

async function binarySearch(){

    if(sortedArray.length === 0){

        alert("Please sort the array first!");

        return;
    }

    const target = parseInt(prompt("Enter number to search"));

    const bars = document.getElementsByClassName("bar");

    let left = 0;

    let right = sortedArray.length - 1;

    while(left <= right){

        let mid = Math.floor((left + right)/2);

        bars[mid].style.background = "red";

        await sleep(1000);

        if(sortedArray[mid] == target){

            bars[mid].style.background = "lime";

            document.getElementById("result").innerHTML =
            "Element " + target + " found at position " + mid;

            return;
        }

        else if(sortedArray[mid] < target){

            bars[mid].style.background = "gray";

            left = mid + 1;
        }

        else{

            bars[mid].style.background = "gray";

            right = mid - 1;
        }
    }

    document.getElementById("result").innerHTML =
    "Element not found";

}

function sleep(ms){

    return new Promise(resolve => setTimeout(resolve, ms));
}

</script>

</body>
</html>
